[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookpecker"
version = "0.1.0"
description = "Scanned book PDFs → clean Markdown with local OCR (multi-column layouts, ornament/margin filtering)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
# PaddlePaddle itself (CPU or GPU build) is installed separately, see README.
paddle = ["paddleocr[doc-parser]>=3.3"]
dev = ["pytest>=8"]

[project.scripts]
bookpecker = "bookpecker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bookpecker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
