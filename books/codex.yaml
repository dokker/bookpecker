# bookpecker book config – every key except `pdf` is optional (defaults in config.py /
# config/defaults.yaml). Page numbers are 1-based PDF page indices.
title: "Codex"
pdf: "/home/docker/Dropbox/books/codex/Codex alapkönyv.pdf"                 # relative to this folder, the project root, or absolute

first_page_side: right          # side of PDF page 1: right (recto) | left (verso)
skip_pages: []                  # e.g. ["1-4", 120, "250-"]  (cover, blank pages, index…)
page_number_offset: 4           # printed page = PDF page + offset (only for <!-- page --> markers)

dpi: 300
columns: auto                   # auto | 1 | 2 | 3 …
margins:                        # ignored edges, share of page size; inner = spine side
  top: 0.05
  bottom: 0.05
  inner: 0.015                 # text runs almost into the gutter; bleed-through is dropped by edge_touch
  outer: 0.05

layout_engine: doclayout        # doclayout (PP-DocLayout) | heuristic (no model)
ocr:
  default: tesseract            # tesseract | paddle_vl
  # table: paddle_vl            # e.g. VLM only for tables
languages: [hun]
heading_levels: flat            # flat: every heading "##" | auto: from glyph size

sidebars:
  lines: true                   # ruled boxes
  shading: true                 # tinted boxes
  placement: inline             # inline | page_end

# drop_kinds: [header, footer, page_number, ornament, figure]

# Skill tables start with "NN% – …"; Tesseract reads the small "%" as "96"/"90"/"06" and
# sometimes picks up a stray mark before it: normalise the whole paragraph opening.
replacements:
  - pattern: '^[^\w\s]{0,2}\s*(?:\d\s+)?(\d{1,3})(?:%|96|90|06|926)\s*[-–—]*\s*(?=\w)'
    repl: '\1% – '

page_overrides: {}
#  "37-42": {columns: 1}
#  "88": {layout_engine: heuristic, margins: {top: 0.15}}
